<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>미샘파인 · 개인회계</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eef1f0;--card:#fff;--ink:#1c2733;--mut:#66727d;--line:#d5dcd9;--ac:#1f6f5c;--onac:#fff;--acs:#dcefe9;--warn:#b4432f;--amb:#8a6410;--ambs:#f6ecd0}
@media(prefers-color-scheme:dark){:root{--bg:#141a1f;--card:#1d252b;--ink:#e6ecef;--mut:#93a0a9;--line:#2f3a42;--ac:#5fc0a5;--onac:#0d1a16;--acs:#1d3a33;--warn:#f0806b;--amb:#e6c266;--ambs:#3a3220}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header,nav,main{max-width:860px;margin:0 auto;padding-left:14px;padding-right:14px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:18px;padding-bottom:10px}
h1{margin:0;font:700 26px/1.2 "Noto Serif KR","Nanum Myeongjo",Batang,serif;letter-spacing:-.02em}
header p{margin:2px 0 0;color:var(--mut);font-size:13px}
.mn{display:flex;gap:6px}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.mn select{width:auto}
button{padding:9px 13px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;min-height:40px}
button.pri{background:var(--ac);border-color:var(--ac);color:var(--onac)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:2px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line)}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;flex:1;white-space:nowrap;color:var(--mut)}
nav button.on{color:var(--ink);border-color:var(--ac);font-weight:700}
main{padding-top:14px;padding-bottom:70px}
.pn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.cd span{display:block;color:var(--mut);font-size:12px}.cd b{font-size:18px}
.cd.ac{background:var(--ac);border-color:var(--ac);color:var(--onac)}.cd.ac span{color:inherit;opacity:.85}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{border-bottom:3px double var(--ink);font-size:13px;color:var(--mut);font-weight:600}
.neg{color:var(--warn);font-weight:700}tr.fx td{color:var(--mut)}small,.mu{color:var(--mut);font-size:13px}
.scroll{overflow-x:auto}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac)}.bar i.w{background:var(--amb)}.bar i.o{background:var(--warn)}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--mut)}
label input,label select,label textarea{margin-top:4px;color:var(--ink);font-size:15px}
.pv{background:var(--acs);border-radius:6px;padding:10px 12px;margin:4px 0 12px}
.pv div{display:flex;justify-content:space-between;padding:2px 0}
.dc{border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:6px;padding:10px 12px;margin-bottom:8px}
.dc.hold{border-left-color:var(--amb)}.dc.done{border-left-color:var(--mut)}.dc.void{border-left-color:var(--line);opacity:.65}
.dc .t{display:flex;justify-content:space-between;gap:8px}
.bd{font-size:12px;background:var(--acs);border-radius:10px;padding:1px 8px;align-self:flex-start;text-align:right}
.dc.hold .bd{background:var(--ambs);color:var(--amb)}
.ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ac button{min-height:36px;padding:6px 11px}
.wn{background:var(--ambs);color:var(--amb);padding:8px 10px;border-radius:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.md{background:var(--card);border-radius:10px;padding:18px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.md h3{margin:0 0 8px}.bt{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.ck{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px}.ck input{width:auto;margin-top:4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1}
.flt{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;margin-bottom:10px}
.br{display:grid;grid-template-columns:1fr 120px auto auto;gap:6px;align-items:center;margin-bottom:8px}
.br label{margin:0;color:var(--ink);white-space:nowrap}.br label input{width:auto;margin:0 3px 0 0}
.kv div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
@media(max-width:560px){.sr{grid-template-columns:1fr 1fr}.sr b{grid-column:1/-1}.flt{grid-template-columns:1fr}.br{grid-template-columns:1fr 110px}}
.sb{margin:-2px 0 14px 12px}.sr{display:grid;grid-template-columns:1fr 1.4fr 110px auto;gap:6px;align-items:center;margin-bottom:6px}.sb input{padding:6px 8px}.sr b{font-size:14px;white-space:nowrap}.sb button{min-height:32px;padding:4px 10px}.chip{display:inline-flex;align-items:center;gap:2px;background:var(--acs);border-radius:14px;padding:2px 2px 2px 10px;font-size:13px}.chip button{border:0;background:none;min-height:24px;padding:0 8px}

#appHeader,#tabs,#main{transition:opacity .15s}body.auth-required #appHeader,body.auth-required #tabs,body.auth-required #main{display:none}
.authbox{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.authcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.08)}.authcard h1{margin-bottom:6px}.authcard .logo{font-size:42px;margin-bottom:6px}.authmsg{padding:10px;border-radius:7px;background:var(--acs);margin:10px 0;font-size:13px}.autherr{background:var(--ambs);color:var(--amb)}.authactions{display:flex;gap:8px;margin-top:10px}.authactions button{flex:1}.userbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}.userpill{font-size:12px;color:var(--mut);background:var(--acs);padding:5px 9px;border-radius:14px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body class="auth-required">
<div id="authGate" class="authbox">
  <div class="authcard">
    <div class="logo">🏫</div>
    <h1>미샘파인</h1>
    <p class="mu">예산편성 → 품의 → 지출 → 결산</p>
    <div id="authMsg" class="authmsg" hidden></div>
    <label>이메일<input id="authEmail" type="email" autocomplete="email" placeholder="example@email.com"></label>
    <label>비밀번호<input id="authPw" type="password" autocomplete="current-password" placeholder="6자 이상"></label>
    <div class="authactions"><button class="pri" onclick="login()">로그인</button><button onclick="signup()">회원가입</button></div>
    <p class="mu" style="margin-top:14px">같은 계정으로 PC와 휴대폰에서 로그인하면 데이터가 자동으로 동기화됩니다.</p>
    <p id="setupHint" class="mu" style="font-size:12px"></p>
  </div>
</div>
<header id="appHeader">
  <div><h1>🏫 미샘파인</h1><p>예산편성 → 품의 → 지출 → 결산</p><p id="sy"></p></div>
  <div class="mn"><select id="mo" aria-label="월 선택" onchange="db.cur=this.value;save();render()"></select><button onclick="addMonth()">월 추가</button></div><div class="userbar"><span id="userPill" class="userpill"></span><button onclick="logout()">로그아웃</button></div>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<div id="toast" role="status"></div>
<script>
const KEY='misaemfine.friend.v2',$=s=>document.querySelector(s);
// 배포 전 Supabase 프로젝트 정보만 넣으면 됩니다. anon key는 브라우저에 공개되어도 되는 키입니다.
const SUPABASE_URL='https://kehinavxznqbanetkbpy.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_NGhpiK-r7WZE12jnKE4VoQ_cQsRt0fO';
const sbReady=!SUPABASE_URL.startsWith('YOUR_')&&!SUPABASE_ANON_KEY.startsWith('YOUR_');
const supabase=window.supabase&&sbReady?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let session=null;
const num=n=>(n||0).toLocaleString('ko-KR'),won=n=>num(n)+'원';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const mname=k=>{const [y,m]=k.split('-');return y+'년 '+(+m)+'월'};
const fdt=t=>{const x=new Date(t);return (x.getMonth()+1)+'월 '+x.getDate()+'일 '+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')};
const pct=r=>r.toFixed(1)+'%';
const bar=r=>`<div class="bar"><i class="${r>100?'o':r>=80?'w':''}" style="width:${Math.min(r,100)}%"></i></div>`;

function defItems(){return [
 ['교통/주유',150000],['비정기지출 (병원·경조사·미용·수리 등)',80000],['약속/외식',250000],['식비/생필품',350000],['감정소비',50000],
 ['공과금·구독·보험 등',0,1],['변제금',0,1],['저축/투자',0,1]
].map(a=>({id:uid(),name:a[0],amt:a[1],fixed:!!a[2]}))}
function seed(){return{v:1,fresh:1,set:{warn:50000,hold:50000,hrs:24,v:2},cur:'2026-10',months:{'2026-10':{income:0,carry:0,items:defItems()}},docs:[]}}
function mig(d){Object.values(d.months).forEach(m=>m.items.forEach(i=>{if(i.subs)i.subs=i.subs.map(x=>typeof x==='string'?{name:x,expr:'',amt:0}:x)}));return d}
function calcExpr(s){s=String(s||'').replace(/[xX×]/g,'*').replace(/÷/g,'/').replace(/[^0-9.+\-*\/() ]/g,'').trim();if(!s)return null;try{const v=Function('"use strict";return('+s+')')();return Number.isFinite(v)&&v>=0?Math.round(v):null}catch(e){return null}}
const amtOf=e=>String(e||'').trim()===''?0:calcExpr(e);
const sync=it=>{if(it.subs&&it.subs.length)it.amt=it.subs.reduce((a,s)=>a+(s.amt||0),0)};
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.months&&d.docs&&d.set){if(!d.set.v){d.set.v=2;d.set.hold=50000}return mig(d)}}}catch(e){}return seed()}
function saveLocal(){db._t=Date.now();delete db.fresh;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('저장할 수 없습니다. 백업 파일을 내려받아 두세요.')}}
function save(){saveLocal();pushCloud()}
let db=load(),tab='home',F={q:'',item:'',st:''};
const cm=()=>db.months[db.cur];

function calc(mk){
  const m=db.months[mk],docs=db.docs.filter(d=>d.month===mk&&d.st!=='void');
  const rows=m.items.map(it=>{let pu=0,sp=0,used=0;
    if(it.fixed){pu=sp=used=it.amt}
    else docs.filter(d=>d.item===it.id).forEach(d=>{pu+=d.amt;if(d.st==='done'){sp+=d.paid;used+=d.paid}else used+=d.amt});
    const subs=it.fixed?[]:(it.subs||[]).map(x=>{let pu2=0,sp2=0,u=0;docs.filter(d=>d.item===it.id&&d.sub===x.name).forEach(d=>{pu2+=d.amt;if(d.st==='done'){sp2+=d.paid;u+=d.paid}else u+=d.amt});return{name:x.name,bud:x.amt,pu:pu2,sp:sp2,used:u,bal:x.amt-u,rate:x.amt?u/x.amt*100:0}});
    return{it,subs,bud:it.amt,pu,sp,used,bal:it.amt-used,rate:it.amt?used/it.amt*100:0}});
  rows.sort((a,b)=>(a.it.fixed?1:0)-(b.it.fixed?1:0));
  const t=rows.reduce((a,r)=>({bud:a.bud+r.bud,pu:a.pu+r.pu,sp:a.sp+r.sp,used:a.used+r.used,bal:a.bal+r.bal}),{bud:0,pu:0,sp:0,used:0,bal:0});
  t.rate=t.bud?t.used/t.bud*100:0;
  return{rows,t};
}

function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',3400)}
function modal(h,btns){return new Promise(res=>{
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="md" role="dialog" aria-modal="true">${h}<div class="bt">${btns.map((b,i)=>`<button class="${b.c||''}" data-i="${i}">${b.t}</button>`).join('')}</div></div>`;
  document.body.appendChild(o);
  const ck=o.querySelector('#ck'),pb=o.querySelector('.pri');
  if(ck){pb.disabled=true;ck.onchange=()=>pb.disabled=!ck.checked}
  o.onclick=e=>{const b=e.target.closest('button[data-i]');
    if(b){const x=btns[+b.dataset.i];if(x.ok&&!x.ok(o))return toast(x.m||'입력을 확인하세요.');const v=x.v?x.v(o):x.r;o.remove();res(v)}
    else if(e.target===o){o.remove();res(null)}};
});}

/* ---------- 화면 ---------- */
function vHome(){
  const{rows,t}=calc(db.cur),open=db.docs.filter(d=>d.month===db.cur&&(d.st==='ok'||d.st==='hold')).length;
  const cd=(l,v,c)=>`<div class="cd ${c||''}"><span>${l}</span><b>${v}</b></div>`;
  return `<div class="grid">${cd('이번 달 예산',won(t.bud))}${cd('품의액',won(t.pu))}${cd('실제 지출액',won(t.sp))}${cd('집행잔액',won(t.bal),'ac')}${cd('예산 집행률',pct(t.rate))}</div>
  <div class="pn">${bar(t.rate)}<p class="mu" style="margin:8px 0 0">집행잔액은 남은 예산일 뿐, 자유롭게 써도 되는 돈이 아닙니다. 쓰기 전에 품의부터 작성하세요.</p></div>
  ${open?`<p class="wn">지출을 등록하지 않은 품의가 ${open}건 있습니다. <a href="#" onclick="go('doc');return false" style="color:inherit">확인하기</a></p>`:''}
  <section class="pn"><h2>${mname(db.cur)} 과목별 집행현황</h2><div class="scroll"><table><thead><tr><th>과목</th><th>예산</th><th>품의</th><th>지출</th><th>잔액</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="${r.it.fixed?'fx':''}"><td>${esc(r.it.name)}${r.it.fixed?' <small>고정</small>':''}</td><td>${num(r.bud)}</td><td>${num(r.pu)}</td><td>${num(r.sp)}</td><td class="${r.bal<0?'neg':''}">${num(r.bal)}</td></tr>${subRows(r)}`).join('')}
  </tbody></table></div><div class="ac"><button class="pri" onclick="go('doc')">지출품의 작성</button></div></section>`;
}

function vDoc(){
  const its=cm().items.filter(i=>!i.fixed);
  if(!its.length)return '<section class="pn"><p>품의할 변동 과목이 없습니다. [예산] 탭에서 과목을 추가하세요.</p></section>';
  return `<section class="pn"><h2>지출품의 작성</h2>
  <label>예산과목<select id="fi" onchange="subs();prev()">${its.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select></label>
  <label id="sl">목<select id="fs" onchange="prev()"></select></label>
  <label>품의금액(원)<input id="fa" type="number" inputmode="numeric" min="1" oninput="prev()"></label>
  <label>품의내용<input id="ft" maxlength="60" placeholder="무엇을 살 건가요?"></label>
  <label>날짜<input id="fd" type="date" value="${today()}"></label>
  <label>메모<textarea id="fm" rows="2" placeholder="왜 필요한지 한 줄"></textarea></label>
  <div id="pv" class="pv"></div>
  <button class="pri" onclick="submitDoc()">예산 확인 후 품의</button></section>
  <section class="pn"><h2>진행 중인 품의</h2><div id="open"></div></section>`;
}
function subs(){const it=cm().items.find(i=>i.id===$('#fi').value),s=it.subs||[];$('#sl').style.display=s.length?'':'none';$('#fs').innerHTML=s.map(x=>`<option>${esc(x.name)}</option>`).join('')}
function prev(){
  const r=calc(db.cur).rows.find(r=>r.it.id===$('#fi').value),sb=(r.subs||[]).find(x=>x.name===$('#fs').value),B=sb||r,a=Math.round(+$('#fa').value)||0,after=B.bal-a,un=B.used-B.sp,L=sb?'목 ':'';
  $('#pv').innerHTML=`<div><span>${L}예산액</span><b>${won(B.bud)}</b></div><div><span>현재 지출액</span><b>${won(B.sp)}</b></div>${un?`<div><span>지출 전 품의액</span><b>${won(un)}</b></div>`:''}<div><span>현재 잔액</span><b>${won(B.bal)}</b></div><div><span>이번 품의</span><b>${won(a)}</b></div><div><span>품의 후 예상 잔액</span><b class="${after<0?'neg':''}">${won(after)}</b></div>${after<0?'<div class="neg">예산액을 초과합니다.</div>':''}`;
}
function drawOpen(){
  const l=db.docs.filter(d=>d.month===db.cur&&(d.st==='ok'||d.st==='hold'));
  $('#open').innerHTML=l.length?l.map(rowDoc).join(''):'<p class="mu">진행 중인 품의가 없습니다.</p>';
}
async function submitDoc(){
  const it=cm().items.find(i=>i.id===$('#fi').value),a=Math.round(+$('#fa').value),t=$('#ft').value.trim(),d=$('#fd').value||today(),memo=$('#fm').value.trim();
  if(!(a>0))return toast('품의금액을 입력하세요.');
  if(!t)return toast('품의내용을 입력하세요.');
  const r=calc(db.cur).rows.find(r=>r.it.id===it.id);
  const sb=(r.subs||[]).find(x=>x.name===$('#fs').value),B=sb||r;
  if(a>B.bal){await modal(`<h3>⚠️ 예산액을 초과했습니다.</h3><p>${sb?'목 「'+esc(sb.name)+'」의 ':''}현재 집행 가능한 잔액은 <b>${won(Math.max(B.bal,0))}</b>입니다.</p><p class="mu">꼭 필요한 지출이라면 [예산] 탭에서 편성을 먼저 바꾼 뒤 품의하세요.</p>`,[{t:'확인',c:'pri',r:1}]);return}
  const hold=a>=db.set.hold&&db.set.hold>0,big=a>=db.set.warn&&db.set.warn>0;

async function spend(id){
  const d=db.docs.find(x=>x.id===id),edit=d.st==='done',wait=d.st==='hold'&&Date.now()<d.until;
  const r=await modal(`<h3>${edit?'지출 수정':'실제 지출 등록'}</h3><p class="mu">${esc(d.title)} / 품의 ${won(d.amt)}</p>${wait?`<p class="wn">아직 대기 시간(${fdt(d.until)}까지)입니다. 지금 지출하면 클린재정에 등재되고 소명이 남습니다.</p><label>소명 (왜 기다리지 못했는지)<textarea id="rs" rows="3"></textarea></label>`:d.st==='hold'?'<p class="wn">대기 시간이 지났습니다. 지금도 꼭 필요한 지출인지 한 번 더 생각해 보세요.</p>':''}<label>실제 결제금액(원)<input id="pa" type="number" inputmode="numeric" value="${edit?d.paid:d.amt}"></label><label>지출일<input id="pd" type="date" value="${edit?d.paidDate:today()}"></label>`,
    [{t:'취소',r:null},{t:edit?'수정 저장':wait?'소명하고 지출':'지출 등록',c:'pri',ok:o=>!wait||o.querySelector('#rs').value.trim(),m:'소명 내용을 입력하세요.',v:o=>({p:Math.round(+o.querySelector('#pa').value),dt:o.querySelector('#pd').value||today(),rs:wait?o.querySelector('#rs').value.trim():''})}]);
  if(!r)return;

  const row=calc(d.month).rows.find(x=>x.it.id===d.item),ref=row&&((row.subs||[]).find(x=>x.name===d.sub)||row);
  if(ref&&r.p>ref.bal+(edit?d.paid:d.amt)){await modal(`<h3>⚠️ 예산액을 초과했습니다.</h3><p>이 지출에 쓸 수 있는 금액은 <b>${won(ref.bal+(edit?d.paid:d.amt))}</b>까지입니다.</p>`,[{t:'확인',c:'pri',r:1}]);return}
  d.st='done';d.paid=r.p;d.paidDate=r.dt;if(wait){d.flag=1;d.reason=r.rs;d.flagAt=Date.now();d.leftH=Math.ceil((d.until-Date.now())/36e5)}save();render();
  toast(wait?'지출이 등록되고 클린재정에 등재되었습니다.':r.p===d.amt?'지출이 등록되었습니다.':`지출이 등록되었습니다. 차액 ${won(d.amt-r.p)}은 집행잔액에 반영됩니다.`);
}

function updSub(id,k,f,v){const it=cm().items.find(x=>x.id===id),x=it.subs[k];

function setS(k,v){db.set[k]=Math.max(k==='hrs'?1:0,Math.round(+v||0));save();toast('저장했습니다.')}

function restore(f){
  if(!f)return;const r=new FileReader();
  r.onload=async()=>{
    let d;try{d=JSON.parse(r.result);if(!d.months||!Array.isArray(d.docs)||!d.set)throw 0}catch(e){return toast('올바른 백업 파일이 아닙니다.')}
    if(!await modal('<h3>백업으로 복원할까요?</h3><p>현재 데이터는 백업 내용으로 교체됩니다.</p>',[{t:'취소',r:0},{t:'복원',c:'pri',r:1}]))return;
    db=mig(d);if(!db.months[db.cur])db.cur=Object.keys(db.months).sort()[0];save();render();toast('복원했습니다.');
  };
  r.readAsText(f);
}
async function resetAll(){
  if(!await modal('<h3>전체 초기화</h3><p>모든 예산, 품의, 지출 기록이 삭제됩니다. 먼저 백업을 받아 두세요.</p>',[{t:'취소',r:0},{t:'전체 삭제',c:'pri',r:1}]))return;
  db=seed();save();render();toast('초기화했습니다.');
}

/* ---------- 계정 / 클라우드 ---------- */
function authMsg(msg,err=false){const e=$('#authMsg');e.hidden=!msg;e.textContent=msg;e.className='authmsg'+(err?' autherr':'')}
function authBusy(v){['#authEmail','#authPw'].forEach(x=>$(x).disabled=v)}
function showUser(){const e=$('#userPill');if(e)e.textContent=session?.user?.email||''}
async function login(){
  if(!supabase)return authMsg('사이트 설정이 아직 완료되지 않았습니다. Supabase 설정을 먼저 넣어주세요.',true);
  const email=$('#authEmail').value.trim(),password=$('#authPw').value;
  if(!email||!password)return authMsg('이메일과 비밀번호를 입력하세요.',true);
  authBusy(true);authMsg('로그인 중…');
  const {data,error}=await supabase.auth.signInWithPassword({email,password});authBusy(false);
  if(error)return authMsg(error.message,true);await enterApp(data.session);
}
async function signup(){
  if(!supabase)return authMsg('사이트 설정이 아직 완료되지 않았습니다. Supabase 설정을 먼저 넣어주세요.',true);
  const email=$('#authEmail').value.trim(),password=$('#authPw').value;
  if(!email||password.length<6)return authMsg('이메일과 비밀번호(6자 이상)를 입력하세요.',true);
  authBusy(true);authMsg('회원가입 중…');
  const {data,error}=await supabase.auth.signUp({email,password});authBusy(false);
  if(error)return authMsg(error.message,true);
  if(data.session) await enterApp(data.session); else authMsg('가입 완료! 이메일 인증을 마친 뒤 로그인하세요.');
}
async function logout(){if(supabase)await supabase.auth.signOut();session=null;document.body.classList.add('auth-required');showUser();authMsg('로그아웃되었습니다.');}
async function enterApp(s){
  session=s||session;if(!session)return;
  document.body.classList.remove('auth-required');showUser();authMsg('');
  setSy('busy');
  const {data,error}=await supabase.from('user_data').select('data,updated_at').eq('user_id',session.user.id).maybeSingle();
  if(error){setSy('err');toast('클라우드 데이터를 불러오지 못했습니다. 이 기기의 데이터는 유지됩니다.');return render()}
  if(data?.data){try{db=mig(data.data);localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('클라우드 데이터 형식이 올바르지 않습니다.')}}
  else {saveLocal();await pushCloud(true)}
  render();setSy('on');
}
let pushT=0;
function setSy(t){const e=$('#sy');if(e)e.textContent={local:'이 기기에만 저장됩니다',on:'☁️ 동기화됨',busy:'☁️ 저장 중…',err:'☁️ 동기화 실패 (이 기기에는 저장됨)'}[t]||''}
function pushCloud(immediate=false){
  if(!supabase||!session)return;clearTimeout(pushT);setSy('busy');
  const run=async()=>{try{const {error}=await supabase.from('user_data').upsert({user_id:session.user.id,data:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;setSy('on')}catch(e){console.error(e);setSy('err')}};
  if(immediate)run();else pushT=setTimeout(run,500);
}
async function initAuth(){
  if(!sbReady){$('#setupHint').textContent='⚠️ 관리자 설정 필요: SUPABASE_URL / SUPABASE_ANON_KEY를 코드에 입력하세요.';return setSy('local')}
  const {data}=await supabase.auth.getSession();if(data.session)await enterApp(data.session);
  supabase.auth.onAuthStateChange(async(_event,s)=>{if(s&&!session)await enterApp(s);});
}

/* ---------- 렌더 ---------- */
const V={home:vHome,doc:vDoc,list:vList,bud:vBud,sum:vSum,cln:vClean,set:vSet},A={doc(){if($('#fi')){subs();prev();drawOpen()}},list:drawList};
const TB=[['home','현황'],['doc','품의'],['list','내역'],['bud','예산'],['sum','결산'],['cln','클린재정'],['set','설정']];
function render(){
  $('#mo').innerHTML=Object.keys(db.months).sort().map(k=>`<option value="${k}" ${k===db.cur?'selected':''}>${mname(k)}</option>`).join('');
  $('#tabs').innerHTML=TB.map(([k,n])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${k==='cln'&&flags().length?n+' '+flags().length:n}</button>`).join('');
  $('#main').innerHTML=V[tab]();if(A[tab])A[tab]();
}
function go(t){tab=t;render();window.scrollTo(0,0)}
render();

initAuth();
</script>
